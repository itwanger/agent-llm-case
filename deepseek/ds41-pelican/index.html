<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  :root{
    --ink:#1f3138;
    --accent:#2f7d8c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:24px 16px 32px;
    background:radial-gradient(120% 90% at 50% -10%, #f3fbff 0%, #dceaf2 55%, #c7dbe5 100%);
    color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .stage{
    width:min(960px,100%);
    border-radius:24px;
    overflow:hidden;
    background:#d6eefb;
    box-shadow:0 30px 60px -28px rgba(22,62,80,.5), 0 0 0 1px rgba(255,255,255,.55) inset;
  }
  .stage svg{display:block;width:100%;height:auto}

  .hud{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;
    padding:12px 22px;
    background:rgba(255,255,255,.82);
    border:1px solid rgba(255,255,255,.9);
    border-radius:999px;
    box-shadow:0 12px 30px -18px rgba(22,62,80,.55);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
  }
  .btn{
    appearance:none;border:0;cursor:pointer;
    font:inherit;font-weight:600;font-size:15px;
    color:#fff;background:var(--accent);
    padding:9px 22px;border-radius:999px;
    display:inline-flex;align-items:center;gap:8px;
    box-shadow:0 6px 14px -6px rgba(47,125,140,.9);
    transition:transform .12s ease, background .2s ease;
    white-space:nowrap;
  }
  .btn:hover{background:#26697a}
  .btn:active{transform:translateY(1px) scale(.98)}
  .btn.paused{background:#e08a2e;box-shadow:0 6px 14px -6px rgba(224,138,46,.9)}
  .btn.paused:hover{background:#c9781f}

  .speed{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}
  .speed label{color:#3b5964}
  .speed input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:190px;height:6px;border-radius:999px;
    background:linear-gradient(90deg,#9fd0d9,#2f7d8c);
    outline:none;cursor:pointer;
  }
  .speed input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:20px;height:20px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);
    box-shadow:0 3px 8px -2px rgba(0,0,0,.35);
  }
  .speed input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);
    box-shadow:0 3px 8px -2px rgba(0,0,0,.35);
  }
  .speed output{
    font-variant-numeric:tabular-nums;
    min-width:56px;text-align:right;color:#3b5964;
  }
  .hint{font-size:12.5px;color:#6b8794;text-align:center;margin:0}
  @media (max-width:560px){
    .speed input[type=range]{width:120px}
    .hud{gap:12px;padding:12px 16px}
  }
</style>
</head>
<body>

<div class="stage">
  <svg id="scene" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg"
       xmlns:xlink="http://www.w3.org/1999/xlink"
       role="img" aria-labelledby="sceneTitle sceneDesc" shape-rendering="geometricPrecision">
    <title id="sceneTitle">一只鹈鹕骑着自行车向前进</title>
    <desc id="sceneDesc">长喙与喉囊的鹈鹕坐在车座上，双翅扶着车把，双脚随踏板圆周运动屈伸，车轮与曲柄同步转动，背景向后滚动。</desc>

    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d8f0fc"/>
        <stop offset="0.62" stop-color="#e9f7fd"/>
        <stop offset="1" stop-color="#f6fbfd"/>
      </linearGradient>

      <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffe9a8"/>
        <stop offset="0.55" stop-color="#ffd884"/>
        <stop offset="1" stop-color="#ffd884" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.55" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.58" stop-color="#fbf6ec"/>
        <stop offset="1" stop-color="#e7dcc7"/>
      </linearGradient>

      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.5">
        <stop offset="0" stop-color="#ffc247"/>
        <stop offset="1" stop-color="#ef8b1d"/>
      </linearGradient>

      <linearGradient id="pouchGrad" x1="0.1" y1="0" x2="0.6" y2="1">

        <stop offset="0.6" stop-color="#f9ad3c"/>
        <stop offset="1" stop-color="#e08c25"/>

      <filter id="softShadow" x="-40%" y="-90%" width="180%" height="280%">

      </filter>

      <!-- ===== reusable wheel (drawn at origin, r = 88) ===== -->

        <circle r="4" fill="#c9d4db"/>

      <!-- ===== scrolling background tiles ===== -->
      <g id="tileClouds" fill="#ffffff">

    </defs>

    <!-- ================= SKY ================= -->
    <rect x="0" y="0" width="960" height="502" fill="url(#skyGrad)"/>

      <path d="M455 455 L652 352" stroke-width="11"/>
      <path d="M388 360 L654 322" stroke-width="11"/>
      <path d="M455 455 L300 430" stroke-width="9"/>
      <path d="M388 362 L300 430" stroke-width="9"/>
      <path d="M652 352 L666 300" stroke-width="13"/>
      <path d="M664 316 L700 430" stroke-width="9"/>
      <path d="M666 300 L688 288" stroke-width="8"/>

    <circle cx="300" cy="430" r="6" fill="#39444d"/>
    <circle cx="700" cy="430" r="6" fill="#39444d"/>

    <path d="M324 334 C324 324 334 317 354 315 C378 313 402 318 406 328 C408 337 394 342 372 342 C350 342 324 343 324 334 Z"

    <path d="M328 332 C332 325 342 320 356 319 C376 317 398 321 403 328" fill="none" stroke="#a86f55" stroke-width="3"/>

               C540 322 480 316 440 306
               C424 302 414 300 412 296 Z"
            fill="#e6dcc8"/>
      <path d="M640 306 C672 306 702 300 724 292 L721 304 C698 312 672 316 640 318 Z" fill="#55636e"/>
      <ellipse cx="722" cy="297" rx="15" ry="12" fill="#55636e"/>
    </g>

    <!-- ================= PELICAN ================= -->
    <g id="pelican">

              fill="url(#bodyGrad)" stroke="#d9cdb6" stroke-width="2"/>
        <!-- tail -->
        <path d="M326 312 C300 300 274 292 250 294 C262 306 268 320 286 330 C302 328 316 322 326 312 Z"

        <!-- neck -->

        <!-- scarf: knot tied at the neck, ribbon streaming behind -->
        <path id="scarf" d="" fill="#e8563f"/>
        <ellipse cx="449" cy="282" rx="13" ry="11" fill="#e8563f"/>
        <path d="M439 288 C444 293 455 293 459 287" fill="none" stroke="#c9432e"
              stroke-width="2.6" stroke-linecap="round" opacity=".65"/>

        <g id="headGrp">
          <!-- crest -->
          <path d="M504 192 C490 176 474 168 458 170 C472 182 482 196 488 208 Z" fill="#e8dfd0"/>
          <!-- head -->
          <ellipse cx="528" cy="208" rx="30" ry="26" fill="url(#bodyGrad)" stroke="#d9cdb6" stroke-width="2"/>
          <!-- upper mandible -->
          <path d="M546 192 C592 190 642 202 674 222 C680 226 678 234 670 233

          <!-- pouch / lower mandible -->
          <path d="M548 216 C566 224 596 232 668 236

          <path d="M546 214 C590 214 632 224 670 234" fill="none" stroke="#c86a1f"
                stroke-width="3" stroke-linecap="round"/>
          <path d="M558 234 C582 252 612 264 646 264" fill="none" stroke="#e09a3e"

          <!-- eye -->
          <circle cx="534" cy="196" r="10" fill="#ffffff" stroke="#d9cdb6" stroke-width="1.5"/>
          <circle cx="537.5" cy="197" r="5.6" fill="#2c343b"/>
          <circle cx="535.5" cy="195" r="2" fill="#ffffff"/>

      </g>

      <!-- near wing (attached to the flank, sweeps forward under the pouch and grips the bar) -->

                 C660 311 700 304 726 292

                 C698 316 660 322 600 322
                 C540 322 480 316 440 306
                 C424 302 414 300 412 296 Z"

        <g fill="none" stroke="#cfc3a9" stroke-width="2.4" stroke-linecap="round">
          <path d="M482 301 L474 316"/>
          <path d="M532 307 L524 321"/>
          <path d="M582 310 L574 322"/>
          <path d="M632 311 L626 322"/>
        </g>
        <ellipse cx="722" cy="297" rx="16" ry="13" fill="#3f4d57" stroke="#f8f3e7" stroke-width="2.5"/>
      </g>

      <!-- near-side leg (in front of the frame) -->
      <g id="legNear">
        <path id="legNearThighOutline" fill="none" stroke="#d5c9b0" stroke-width="24" stroke-linecap="round"/>
        <path id="legNearThigh" fill="none" stroke="#f9f4e9" stroke-width="20" stroke-linecap="round"/>
        <path id="legNearShinOutline" fill="none" stroke="#b9741f" stroke-width="17" stroke-linecap="round"/>

</div>

<div class="hud">
  <button id="pauseBtn" class="btn" type="button" aria-pressed="false">⏸ 暂停</button>
  <div class="speed">
    <label for="speed">速度</label>
    <input id="speed" type="range" min="0" max="3" step="0.05" value="1"
           aria-label="骑行速度" />
    <output id="speedOut" for="speed">1.00×</output>
  </div>
</div>
<p class="hint">空格键可暂停 / 继续 · 拖动滑块调速，车轮、踏板与双腿始终保持同一节拍</p>

<script>
(function () {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';
  var XLINK = 'http://www.w3.org/1999/xlink';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------------------------------------------------------
     Geometry / timing constants.
     Everything on screen is derived from ONE number: `phase`
     (crank revolutions).  Wheel angle, pedal position, leg IK,
     chain offset and background scroll are all pure functions of
     `phase`, so changing the speed never breaks coordination.
     --------------------------------------------------------------- */
  var CFG = {
    crankRPS: 0.62,          // crank revolutions per second at speed 1
    groundPerCrank: 340,     // ground pixels scrolled per crank revolution
    gear: 1.55,              // wheel revolutions per crank revolution
    wheelR: 88,
    rearHub:  { x: 300, y: 430 },
    frontHub: { x: 700, y: 430 },
    bb:       { x: 455, y: 455 },   // bottom bracket / crank centre
    crankR: 38,                     // crank arm length
    hip:      { x: 402, y: 332 },
    thigh: 86,
    shin:  90,
    tileClouds: 1400,
    tileHills:  1600,
    tileTrees:  640,
    tileGrass:  260,
    tileDash:   240
  };

  var mod = function (v, m) { return ((v % m) + m) % m; };
  var r2 = function (v) { return Math.round(v * 100) / 100; };

  /* ---------- build the repeating background layers ---------- */
  function fillLayer(groupId, tileId, tileW) {
    var g = $(groupId);
    var copies = Math.ceil(960 / tileW) + 2;
    for (var i = 0; i < copies; i++) {
      var u = document.createElementNS(NS, 'use');
      u.setAttribute('href', '#' + tileId);
      u.setAttributeNS(XLINK, 'xlink:href', '#' + tileId);
      u.setAttribute('x', String(i * tileW));
      g.appendChild(u);
    }
  }
  fillLayer('clouds', 'tileClouds', CFG.tileClouds);
  fillLayer('hills',  'tileHills',  CFG.tileHills);
  fillLayer('trees',  'tileTrees',  CFG.tileTrees);
  fillLayer('grass',  'tileGrass',  CFG.tileGrass);
  fillLayer('dashes', 'tileDash',   CFG.tileDash);

  /* ---------- element cache ---------- */
  var E = {
    clouds: $('clouds'), hills: $('hills'), trees: $('trees'),
    grass: $('grass'), dashes: $('dashes'),
    wheelRear: $('wheelRear'), wheelFront: $('wheelFront'), cog: $('cog'),
    chainring: $('chainring'), chain: $('chain'),
    crankNearArm: $('crankNearArm'), crankFarArm: $('crankFarArm'),
    pedalNear: $('pedalNear'), pedalFar: $('pedalFar'),
    nearThigh: [$('legNearThighOutline'), $('legNearThigh')],
    nearShin:  [$('legNearShinOutline'), $('legNearShin')],
    nearKnee:  [$('legNearKnee')], nearFoot: $('legNearFoot'),
    farThigh:  [$('legFarThighOutline'), $('legFarThigh')],
    farShin:   [$('legFarShinOutline'), $('legFarShin')],
    farKnee:   [$('legFarKnee')], farFoot: $('legFarFoot'),
    bodyBob: $('bodyBob'), headGrp: $('headGrp'), scarf: $('scarf')
  };

  /* ---------- two-bone IK: knee position for hip -> ankle ---------- */
  function solveKnee(hip, ankle, L1, L2) {
    var dx = ankle.x - hip.x;
    var dy = ankle.y - hip.y;
    var dist = Math.hypot(dx, dy) || 1e-6;
    // keep the chain reachable (never happens with the tuned numbers,
    // but makes the solver safe if someone edits CFG)
    var d = Math.min(L1 + L2 - 0.4, Math.max(Math.abs(L1 - L2) + 0.4, dist));
    var ux = dx / dist, uy = dy / dist;
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var px = hip.x + a * ux, py = hip.y + a * uy;
    var k1 = { x: px - h * uy, y: py + h * ux };
    var k2 = { x: px + h * uy, y: py - h * ux };
    // pick the forward-bending knee (cyclists' knees travel forward)
    return k1.x >= k2.x ? k1 : k2;
  }

  function pedalAt(ang) {
    return {
      x: CFG.bb.x + CFG.crankR * Math.cos(ang),
      y: CFG.bb.y + CFG.crankR * Math.sin(ang)
    };
  }

  function drawLeg(parts, ankle, tilt) {
    var knee = solveKnee(CFG.hip, ankle, CFG.thigh, CFG.shin);
    var thighD = 'M' + CFG.hip.x + ' ' + CFG.hip.y + ' L' + r2(knee.x) + ' ' + r2(knee.y);
    var shinD  = 'M' + r2(knee.x) + ' ' + r2(knee.y) + ' L' + r2(ankle.x) + ' ' + r2(ankle.y);
    parts.thigh.forEach(function (el) { el.setAttribute('d', thighD); });
    parts.shin.forEach(function (el) { el.setAttribute('d', shinD); });
    parts.knee.forEach(function (el) {
      el.setAttribute('cx', r2(knee.x));
      el.setAttribute('cy', r2(knee.y));
    });
    parts.foot.setAttribute('transform',
      'translate(' + r2(ankle.x) + ' ' + r2(ankle.y) + ') rotate(' + r2(tilt) + ')');
  }

  /* ---------- one render pass ---------- */
  function render() {
    var a = phase * Math.PI * 2;              // crank angle (radians)
    var crankDeg = phase * 360;
    var wheelDeg = crankDeg * CFG.gear;       // wheels are geared to the cranks
    var ground = phase * CFG.groundPerCrank;  // distance travelled

    /* background: parallax layers all driven by `ground` */
    E.clouds.setAttribute('transform', 'translate(' + r2(-mod(ground * 0.05, CFG.tileClouds)) + ' 0)');
    E.hills.setAttribute('transform',  'translate(' + r2(-mod(ground * 0.18, CFG.tileHills))  + ' 0)');
    E.trees.setAttribute('transform',  'translate(' + r2(-mod(ground * 0.50, CFG.tileTrees))  + ' 0)');
    E.dashes.setAttribute('transform', 'translate(' + r2(-mod(ground,        CFG.tileDash))   + ' 0)');
    E.grass.setAttribute('transform',  'translate(' + r2(-mod(ground,        CFG.tileGrass))  + ' 0)');

    /* wheels, cog and chainring */
    E.wheelRear.setAttribute('transform',
      'translate(' + CFG.rearHub.x + ' ' + CFG.rearHub.y + ') rotate(' + r2(wheelDeg) + ')');
    E.wheelFront.setAttribute('transform',
      'translate(' + CFG.frontHub.x + ' ' + CFG.frontHub.y + ') rotate(' + r2(wheelDeg) + ')');
    E.cog.setAttribute('transform',
      'translate(' + CFG.rearHub.x + ' ' + CFG.rearHub.y + ') rotate(' + r2(wheelDeg) + ')');
    E.chainring.setAttribute('transform',
      'translate(' + CFG.bb.x + ' ' + CFG.bb.y + ') rotate(' + r2(crankDeg) + ')');
    E.chain.setAttribute('stroke-dashoffset', r2(ground * 0.85));

    /* cranks + pedals (180° apart) */
    var pNear = pedalAt(a);
    var pFar  = pedalAt(a + Math.PI);

    E.crankNearArm.setAttribute('x1', CFG.bb.x);
    E.crankNearArm.setAttribute('y1', CFG.bb.y);
    E.crankNearArm.setAttribute('x2', r2(pNear.x));
    E.crankNearArm.setAttribute('y2', r2(pNear.y));
    E.crankFarArm.setAttribute('x1', CFG.bb.x);
    E.crankFarArm.setAttribute('y1', CFG.bb.y);
    E.crankFarArm.setAttribute('x2', r2(pFar.x));
    E.crankFarArm.setAttribute('y2', r2(pFar.y));

    E.pedalNear.setAttribute('transform', 'translate(' + r2(pNear.x) + ' ' + r2(pNear.y) + ')');
    E.pedalFar.setAttribute('transform',  'translate(' + r2(pFar.x) + ' ' + r2(pFar.y) + ')');

    /* feet ride the pedals: ankle sits just above the pedal platform */
    var tilt = 7 * Math.sin(a + 0.8);
    drawLeg({
      thigh: E.farThigh, shin: E.farShin, knee: E.farKnee, foot: E.farFoot
    }, { x: pFar.x, y: pFar.y - 8 }, tilt);

    drawLeg({
      thigh: E.nearThigh, shin: E.nearShin, knee: E.nearKnee, foot: E.nearFoot
    }, { x: pNear.x, y: pNear.y - 8 }, tilt);

    /* rider body language: gentle bob + head nod, still in sync */
    E.bodyBob.setAttribute('transform',
      'translate(0 ' + r2(-18 + 1.3 * Math.sin(a * 2)) + ')');
    E.headGrp.setAttribute('transform',
      'rotate(' + r2(3 + 2.4 * Math.sin(a)) + ' 448 268)');

    /* fluttering scarf: a travelling wave runs down the ribbon */
    var w1 = Math.sin(a), w2 = Math.sin(a + 1.1), w3 = Math.sin(a + 2.2), w4 = Math.sin(a + 3.0);
    E.scarf.setAttribute('d',
      'M446 272 C406 ' + r2(254 + 13 * w1) + ', 366 ' + r2(240 + 18 * w2) + ', 332 ' + r2(248 + 16 * w3) +
      ' C320 ' + r2(252 + 16 * w3) + ', 318 ' + r2(266 + 13 * w4) + ', 330 ' + r2(266 + 13 * w4) +
      ' C368 ' + r2(274 + 16 * w3) + ', 406 ' + r2(286 + 13 * w2) + ', 446 296 Z');
  }

  /* ---------- clock ---------- */
  var phase = 0;
  var speed = 1;
  var paused = false;
  var last = (typeof performance !== 'undefined' ? performance.now() : Date.now());

  function tick(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;           // don't jump after a tab switch
    if (!paused) phase += dt * speed * CFG.crankRPS;
    render();
    requestAnimationFrame(tick);
  }

  /* ---------- controls ---------- */
  var pauseBtn = $('pauseBtn');
  var speedInput = $('speed');
  var speedOut = $('speedOut');

  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
    pauseBtn.classList.toggle('paused', paused);
    pauseBtn.setAttribute('aria-pressed', String(paused));
  }
  pauseBtn.addEventListener('click', togglePause);

  document.addEventListener('keydown', function (ev) {
    if (ev.code === 'Space' && !/^(INPUT|BUTTON|TEXTAREA|SELECT)$/.test(ev.target.tagName)) {
      ev.preventDefault();
      togglePause();
    }
  });

  function syncSpeed() {
    speed = parseFloat(speedInput.value) || 0;
    speedOut.textContent = speed.toFixed(2) + '×';
  }
  speedInput.addEventListener('input', syncSpeed);
  syncSpeed();

  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
