<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1c22" />
<title>锦鲤池 · Koi Pond</title>
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d242b'/%3E%3Cpath d='M7 17c4-6 12-7 17-3-2 5-9 8-15 6z' fill='%23f3ece0'/%3E%3Cpath d='M11 15c3-3 7-3 9-1-1 2-4 3-7 3z' fill='%23e0492a'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="pond" aria-label="日式锦鲤池"></canvas>

  <div class="ui" id="ui">
    <header class="title" id="title">
      <span class="jp">錦鯉池</span>
      <span class="cn">KOI POND</span>
    </header>

    <div class="controls" id="controls">
      <button class="btn" id="btnPause" type="button" aria-pressed="false">
        <span class="ico" data-ico="pause" aria-hidden="true"></span><span class="lbl">暂停</span>
      </button>
      <button class="btn" id="btnReset" type="button">
        <span class="ico" data-ico="reset" aria-hidden="true"></span><span class="lbl">重置</span>
      </button>
      <button class="btn" id="btnFull" type="button">
        <span class="ico" data-ico="full" aria-hidden="true"></span><span class="lbl">全屏</span>
      </button>
    </div>

    <div class="hint" id="hint">
      <span class="dot"></span>
      <span>点击水面投食</span><i>·</i>
      <span>拖动水面拨动水波</span><i>·</i>
      <span class="key">空格</span>暂停<i>·</i>
      <span class="key">R</span>重置<i>·</i>
      <span class="key">F</span>全屏
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="hud" id="hud" hidden>
      <div><b id="hudFps">--</b> fps</div>
      <div>锦鲤 <b id="hudFish">0</b> · 鱼食 <b id="hudFood">0</b></div>
      <div id="hudStates">--</div>
      <div id="hudRes">--</div>
    </div>
  </div>

  <noscript>
    <p style="color:#e8e2d6;font:16px/1.6 system-ui;padding:24px">此页面需要启用 JavaScript。</p>
  </noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
