<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">骑自行车的鹈鹕</title>
  <desc id="desc">一只白色鹈鹕骑着红色自行车，双脚踏在踏板上，一只翅膀扶着车把，喉囊里兜着一条鱼。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeafb"/>
      <stop offset="1" stop-color="#fdf3df"/>
    </linearGradient>
    <linearGradient id="plumage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe2ea"/>
    </linearGradient>
    <linearGradient id="beakTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb638"/>
      <stop offset="1" stop-color="#f98a1b"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc96b"/>
      <stop offset="1" stop-color="#f2913a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d5a2"/>
      <stop offset="1" stop-color="#7fbd7c"/>
    </linearGradient>

    <g id="wheel">
